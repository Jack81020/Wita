server {
    listen 80;
    listen [::]:80;

    server_name wita.care www.wita.care 20.13.14.29;

    root /var/www/wita/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.(?:css|js|mjs)$ {
        try_files $uri =404;
        expires 1h;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
